name: Test formula

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1
        with:
          core: false
          cask: false
      - name: Check formula style
        run: brew style Formula/anarres.rb
      - name: Audit formula
        run: brew audit --strict --formula Formula/anarres.rb
      - name: Install and test formula
        run: |
          brew install --formula Formula/anarres.rb
          brew test anarres
